[project]
name = "NightShift"
version = "0.6.2"
description = "Copy cataloging bot"
authors = [{name = "Tomasz Kalata", email = "klingaroo@gmail.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pymarc (>=5.1.2)",
    "bookops-worldcat (>=1.0.0)",
    "loggly-python-handler (>=1.0.1)",
    "SQLAlchemy (>=1.4.40)",
    "PyYAML (>=6.0.1)",
    "psycopg2 (>=2.9.9)",
    "paramiko (>=3.4.0)",
    "bookops-bpl-solr @ git+https://github.com/BookOps-CAT/bookops-bpl-solr",
    "bookops-nypl-platform @ git+https://github.com/BookOps-CAT/bookops-nypl-platform",
    "bookops-marc @ git+https://github.com/BookOps-CAT/bookops-marc.git"
]

[dependency-groups]
dev = [
    "pytest>=8.1.1",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "types-requests>=2.31.0.20241016",
    "types-paramiko>=3.4.0",
    "pytest-sftpserver>=1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "local: locally run test to be excluded from CI",
    "firewalled: tests that can only run inside firewall network, skipping CI"
]

[tool.coverage.run]
relative_files = true
source = ["."]

[tool.mypy]
python_version = 3.9
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff.lint]
select = ["F", "E", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "ANN"]

[tool.ruff.format]
skip-magic-trailing-comma = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
